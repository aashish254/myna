[project]
name = "myna"
version = "0.1.0"
description = "Myna: a persistent-state, delta-encoded System-1 decision engine."
authors = [
    { name = "Aashish", email = "145881415+aashish254@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "tokenizers>=0.20",
    "pyarrow>=18.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mlx = ["mlx>=0.20"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
