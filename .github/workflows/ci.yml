name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # No `--extra mlx` here, and the reason is measured rather than assumed. This step
      # did try it, and the runner printed `ImportError: libmlx.so: cannot open shared
      # object file` — PyPI's Linux `mlx` wheel ships the bindings without the native
      # library (`mlx-metal` is marked `sys_platform == 'darwin'`), so on Linux MLX is
      # installable and unloadable at once. SPEC §9.51. What that leaves is a base install
      # where MLX is simply absent, which the two MLX test files skip and the registry
      # reports as a platform note on its four MLX rows (`bench/reproduce.py`
      # `mlx_unloadable_here`) instead of failing §9.43's `--help` assertion on a module
      # this platform cannot load at all.
      - run: uv sync
      - run: uv run pytest -q
      # One assertion, and it is the one that matters to a remote: no credential shape in
      # any blob reachable from a ref. Hits in unreachable leftovers are printed as local
      # debt and do not fail this — and a clone can carry them: a `git clone` of this path
      # measured 2026-09-30 reported 29 of its 554 blobs unreachable, with the same three
      # findings. SPEC §5 P0: the claim behind this step used to be a sentence about a
      # one-off command that walked zero blobs and printed "0 matches" anyway.
      - run: make secrets
